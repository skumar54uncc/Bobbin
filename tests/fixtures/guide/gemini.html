<!-- SYNTHETIC: hand-written to test the pointer. Not copied from gemini.google.com. Elements marked data-expect are the targets: the controls the user acts on. -->
<!doctype html>
<html><body>
  <aside>
    <button aria-label="Settings and help">Settings</button>
  </aside>
  <main>
    <h1>Connected apps</h1>
    <div class="app">
      <span>Google Workspace</span>
      <button role="switch" aria-checked="false" data-expect="connect"><span>Google Workspace</span></button>
    </div>
    <section>
      <h2>Saved info</h2>
      <button data-expect="instructions">+ Add</button>
    </section>
  </main>
</body></html>
