<!-- SYNTHETIC: hand-written to test the pointer. Not copied from claude.ai. Elements marked data-expect are the targets: the controls the user acts on. -->
<!doctype html>
<html><body>
  <nav><a href="/new">New chat</a><button aria-label="Open settings">Settings</button></nav>
  <main>
    <h1>Connectors</h1>
    <p>Connect apps such as Google Drive so Claude can read your files.</p>
    <ul>
      <li class="card"><div><h3>GitHub</h3><p>Code and issues</p></div><button>Connect</button></li>
      <li class="card"><div><h3>Google Drive</h3><p>Docs and files</p></div><button data-expect="connect">Connect</button></li>
    </ul>
    <section hidden><span>Google Drive</span><button>Connect</button></section>
    <form>
      <label for="ins">Instructions for Claude</label>
      <textarea id="ins" data-expect="instructions"></textarea>
      <button>Save</button>
    </form>
  </main>
</body></html>
